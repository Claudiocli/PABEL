# PABEL backing services: Keycloak (identity) + PostgreSQL (user/agent
# keys, agent registry, audit mirror - see schema.sql). Intended for
# Rancher Desktop with the containerd engine:
#   nerdctl compose up -d
#
# (Rancher Desktop's dockerd/moby engine and its bundled `docker` CLI also
# read this file via `docker compose up -d` if that engine is selected
# instead - Moby itself is open source, unlike Docker Desktop. Pick
# whichever engine Rancher Desktop is configured with; this file does not
# assume Docker Desktop and does not need it installed.)
#
# Before the first run:
#   cp .env.example .env         # then fill in real passwords
#   python generate_realm.py     # writes realm-org.json from the template
#
# Dev-only settings: HTTP without TLS, permissive redirect URIs, ports
# published to the host. Do not use as-is outside a local demo.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./realm-org.json:/opt/keycloak/data/import/realm-org.json:ro

  postgres:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # A single shared server instance for every agent product and every
  # installation of it (see docs/phase2-engineering-notes.md for why this
  # replaced an earlier one-container-per-agent design): "which agent is
  # calling" is proven per request by a real Keycloak client_credentials
  # token (core.resolve_agent()), not by which container/URL was reached.
  # Register an agent product (python agents_admin.py add claude-code ...),
  # create its required_role in Keycloak, then create one installation per
  # employee (python agents_admin.py create-installation claude-code ...) -
  # none of that touches this service definition.
  mcp-server:
    build: .
    env_file: .env
    environment:
      # Inside the compose network, services reach each other by service
      # name, not localhost - .env's KEYCLOAK_URL/PABEL_DB_DSN are for
      # scripts run on the host (login.py, agents_admin.py, ...) and don't
      # apply here.
      KEYCLOAK_URL: http://keycloak:8080
      # Keycloak stamps every token's `iss` claim with whatever hostname
      # the browser used to log in (localhost:8080, from the host) - not
      # this container's own route to Keycloak. Without this, token
      # verification fails with a silent 401 (issuer mismatch) even
      # though the token is genuinely valid - see auth.py's
      # KeycloakAuth docstring.
      KEYCLOAK_ISSUER_URL: http://localhost:8080
      PABEL_DB_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PABEL_TRANSPORT: streamable-http
      PABEL_PUBLIC_URL: http://localhost:8001
      # FastMCP defaults to binding 127.0.0.1 (loopback inside the
      # container) - Docker's port mapping can't reach that from outside,
      #  so this must be 0.0.0.0 for a container specifically.
      FASTMCP_HOST: 0.0.0.0
      # Without this, core.py's AUDIT_LOG defaults to /app/audit.jsonl -
      # inside this container's own throwaway filesystem, invisible from
      # the host and gone on the next `compose up`. ./state below is the
      # host directory that path actually lands in.
      PABEL_AUDIT_LOG_PATH: /app/state/audit.jsonl
    ports:
      - "8001:8000"
    volumes:
      - ./authority:/app/authority
      - ./state:/app/state
      - ../documents:/documents
    depends_on:
      - keycloak
      - postgres

volumes:
  pgdata:
